<h1>路網改了，你的早上會怎樣？</h1>
<p class="sub">選一個人。先看他平常早上等車的真實情形。再按「照建議改之後」，看會變好還是變差。</p>

21.5578,25.0846],[121.5556,25.085],[121.5521,25.086],[121.5501,25.0863],[121.5495,25.0855],[121.5491,25.0835],[121.5485,25.081],[121.5477,25.0801],[121.5444,25.0798],[121.5409,25.0796],[121.539,25.0791],[121.5376,25.0779],[121.5337,25.0781],[121.532,25.0782],[121.5298,25.078],[121.5285,25.0777],[121.527,25.0766],[121.5253,25.0771],[121.5249,25.0785],[121.5245,25.0797],[121.5245,25.081],[121.5254,25.0823],[121.5256,25.0836],[121.5248,25.0844]]},{"route":"902","kind":"joint","line":[[121.5623,25.0144],[121.5614,25.0153],[121.5605,25.0164],[121.56,25.0174],[121.5593,25.0182],[121.5579,25.0195],[121.5557,25.0215],[121.5538,25.0233],[121.5526,25.0244],[121.5496,25.0246],[121.549,25.027],[121.549,25.0302],[121.549,25.033],[121.5491,25.0367],[121.5493,25.0378],[121.5491,25.0399],[121.5491,25.0434],[121.5491,25.0481],[121.5492,25.051],[121.5492,25.0532],[121.5493,25.0568],[121.5494,25.0582],[121.5507,25.0608],[121.5548,25.0618],[121.5604,25.0624],[121.5665,25.0632],[121.569,25.0637],[121.5732,25.0651],[121.5784,25.0667],[121.58,25.0671],[121.582,25.0681],[121.5841,25.0691],[121.582,25.071],[121.5798,25.0732],[121.5781,25.0745],[121.5751,25.0764],[121.5723,25.0776],[121.568,25.0796],[121.5651,25.081],[121.5644,25.0829],[121.5615,25.0844],[121.5593,25.0851],[121.5576,25.0846],[121.5558,25.0849],[121.5533,25.0857],[121.5516,25.0861],[121.5502,25.0862],[121.5495,25.0856],[121.5492,25.084],[121.5486,25.0816],[121.5479,25.0803],[121.5459,25.0799],[121.5412,25.0796],[121.5391,25.0794],[121.5389,25.0779],[121.534,25.0781],[121.5328,25.0781],[121.5309,25.0782],[121.5291,25.0779],[121.528,25.0773],[121.5268,25.0766],[121.5256,25.077],[121.5247,25.0792],[121.5243,25.0807],[121.5252,25.0821],[121.5256,25.0831],[121.5257,25.0845],[121.5257,25.0857],[121.5264,25.0868],[121.5272,25.0878],[121.5276,25.0888],[121.5276,25.0903],[121.5278,25.0918],[121.5281,25.0933],[121.5283,25.0944],[121.5282,25.0954],[121.5275,25.0977],[121.5267,25.1002],[121.5259,25.102],[121.5253,25.103],[121.5249,25.1043],[121.525,25.1063],[121.5252,25.1083],[121.5256,25.1106],[121.5261,25.1119],[121.5271,25.1137],[121.5281,25.1155],[121.5295,25.1175],[121.5286,25.1184],[121.5255,25.1185],[121.5232,25.1189],[121.5217,25.1192],[121.5202,25.1187],[121.5187,25.1188],[121.5174,25.118],[121.5162,25.1168],[121.5153,25.1156],[121.5151,25.1147]]}],"me":"紅2"}}]};
const $=id=>document.getElementById(id),T=(k,t)=>`<span class="tag ${k}">${t}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={p:0,after:false};{const h=new URLSearchParams(location.hash.slice(1)),i=D.people.findIndex(x=>x.key===h.get('who'));if(i>=0)st.p=i;st.after=h.get('after')==='1';}
const mins=s=>{const[a,b]=s.split(':');return +a*60+ +b;},hm=m=>`${Math.floor(m/60)}:${String(Math.round(m%60)).padStart(2,'0')}`;
const f1=x=>(+x).toFixed(1).replace(/\.0$/,'');

function who(){$('who').innerHTML=D.people.map((p,i)=>`<button class="${i===st.p?'on':''}" data-i="${i}"><span class="av ${p.role}">${esc(p.name[0])}</span><span><b>${esc(p.who)}・${esc(p.name)}</b><span class="pill ${p.role}">${p.role==='gain'?'改了受益':'改了要付代價'}</span><small>${esc(p.intro)}</small></span></button>`).join('');
  $('who').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.p=+b.dataset.i;st.after=false;draw();});}

// the morning's real buses on a time strip
function strip(p){const h0=p.hours[0]*60,h1=p.hours[1]*60,W=420,H=74,X=m=>22+(m-h0)/(h1-h0)*(W-44);
  const t=p.times.map(mins);let s=`<svg class="strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="這天早上真的來車時間">`;
  s+=`<line x1="14" y1="40" x2="${W-14}" y2="40" stroke="#bbb" stroke-width="2"/>`;
  for(let m=h0;m<=h1;m+=15)s+=`<line x1="${X(m)}" y1="35" x2="${X(m)}" y2="45" stroke="#bbb"/>`+(m%60===0?`<text x="${X(m)}" y="64" font-size="13" text-anchor="middle" fill="#666">${hm(m)}</text>`:'');
  if(p.worst!=null){const a=X(t[p.worst]),b=X(t[p.worst+1]);s+=`<rect x="${a}" y="30" width="${b-a}" height="20" fill="#c0612b" opacity=".15"/><text x="${(a+b)/2}" y="24" font-size="13" text-anchor="middle" fill="#c0612b" font-weight="700">隔 ${Math.round(p.gaps[p.worst])} 分</text>`;}
  for(const i of p.bunch){const a=X(t[i]),b=X(t[i+1]);s+=`<text x="${(a+b)/2}" y="24" font-size="12" text-anchor="middle" fill="#7a3fa0">一起來</text>`;}
  t.forEach((m,i)=>{const b=p.bunch.includes(i)||p.bunch.includes(i-1);s+=`<circle cx="${X(m)}" cy="40" r="6" fill="${b?'#7a3fa0':'#222'}"/>`;});
  return s+'</svg>';}

// the corridor map: the person's route thick, the rest thin; now or after
function map(p){const L=st.after?p.map.new:p.map.now,mine=[...p.map.now,...p.map.new].filter(x=>x.route===p.map.me).flatMap(x=>x.line),all=mine.length?mine:[...p.map.now,...p.map.new].flatMap(x=>x.line);
  const xs=all.map(q=>q[0]),ys=all.map(q=>q[1]),px=(Math.max(...xs)-Math.min(...xs))*.08,py=(Math.max(...ys)-Math.min(...ys))*.08,x0=Math.min(...xs)-px,x1=Math.max(...xs)+px,y0=Math.min(...ys)-py,y1=Math.max(...ys)+py;
  const W=340,k=Math.cos(25*Math.PI/180),sx=(x1-x0)*k,sy=y1-y0,H=Math.round(W*sy/sx)||240,P=([x,y])=>[12+(x-x0)*k/sx*(W-24),12+(y1-y)/sy*(H-24)];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="路線圖"><defs><clipPath id="cp"><rect width="${W}" height="${H}"/></clipPath></defs><g clip-path="url(#cp)">`;
  for(const r of L){const me=r.route===p.map.me,pts=r.line.map(q=>P(q).map(v=>v.toFixed(1)).join(',')).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="${me?(p.role==='gain'?'#2c7bb6':'#c0612b'):'#aaa'}" stroke-width="${me?5:2}" stroke-linejoin="round" stroke-linecap="round" opacity="${me?1:.7}"/>`;}
  s+='</g>';if(p.xy){const[a,b]=P(p.xy),left=a>W*.6;s+=`<circle cx="${a}" cy="${b}" r="7" fill="#fff" stroke="#222" stroke-width="3"/><text x="${left?a-11:a+11}" y="${b+5}" font-size="14" font-weight="700" text-anchor="${left?'end':'start'}" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(p.name)}在這裡上車</text>`;}
  return s+`</svg><div class="cap">${st.after?'照建議改之後':'現在'}：粗線是${esc(p.name)}搭的 ${esc(p.route)}，細線是同一帶的其他路線。</div>`;}

function moments(p){const t=p.times.map(mins),n=p.times.length,h=p.hours[1]-p.hours[0];
  const at=p.worst!=null?t[p.worst]+1:null,wait=p.worst!=null?Math.round(t[p.worst+1]-at):null;
  const real=`<li><div class="when">${esc(D.day_label)} 早上 ${p.hours[0]}–${p.hours[1]} 點・${esc(p.stop_name)}站・${esc(p.route)}往${esc(p.to)}</div>
    <div class="what">這${h>1?` ${h} 小時`:'一小時'}真的來了 ${n} 班 ${T('real','真')}</div>${strip(p)}
    ${at!=null?`<div class="what">如果${esc(p.name)} ${hm(at)} 到站，剛錯過一班。下一班 ${hm(t[p.worst+1])} 才來，要等 ${wait} 分。</div>`:''}
    ${n<4?`<div class="note">${esc(p.route)}本來就班次少，錯過一班就要等很久。</div>`:`<div class="note">${p.bunch.length?`紫色的兩台只隔不到 ${f1(p.cut)} 分（平常班距的 1/4），等於一起到站，這叫串車。`:`這天早上這一站沒有串車（兩班隔不到 ${f1(p.cut)} 分，也就是平常班距的 1/4）。`}問題是車來得不平均：這天早上一半的班距在 ${f1(p.med)} 分內，最久卻隔 ${Math.round(p.gaps[p.worst])} 分。</div>`}</li>`;
  if(p.role==='gain'){const w=p.wait;
    const now=`<li><div class="when">平常（${D.weekdays} 個平日，早上 7–9 點）</div>
      <div class="big">平均等 ${f1(w.now)} 分 <small>${T('real','真')}</small></div>
      <div class="what">10 次裡有 1 次，兩班車隔超過 ${Math.round(w.p90)} 分 ${T('real','真')}</div></li>`;
    const after=`<li class="after"><div class="when">照建議改之後</div>
      <div class="what">${esc(p.route)}每小時 ${f1(p.bph[0])} → ${f1(p.bph[1])} 班 ${T('est','推估')}</div>
      <div class="big">平均等 ${f1(w.after)} 分 <small>現在 ${f1(w.now)} 分 ${T('est','推估')}</small></div>
      <div class="note">這是假設車還是像現在一樣不平均。如果業者把車排均勻，可以再降到約 ${f1(w.after_even)} 分。串車要靠業者調度，不保證消失。</div></li>`;
    return real+(st.after?after:now);}
  const a=p.alt;
  const now=`<li><div class="when">平常</div>
    <div class="what">${esc(p.route)}每小時 ${f1(p.bph[0])} 班，從${esc(p.stop_name)}直達${esc(p.to)}。</div>
    <div class="big">全程約 ${a.bus_min} 分 <small>含等車 ${T('est','推估')}</small></div></li>`;
  const after=`<li class="cost"><div class="when">照建議改之後</div>
    <div class="what">${esc(p.route)}只開社后到捷運大湖公園站的接駁，每小時 ${f1(p.bph[1])} 班。${esc(p.name)}要在捷運大湖公園站轉文湖線。</div>
    <div class="big">全程約 ${a.mrt_min} 分 <small>現在約 ${a.bus_min} 分 ${T('est','推估，待查證')}</small></div>
    <div class="what">時間差不多，但要多轉一次車，還要走進捷運站。對拿拐杖、推娃娃車的人，這是真的代價。</div>
    <div class="note">建議市府同時做兩件事：轉乘第二段不另外收錢；確認大湖公園站的電梯和接駁車停靠位置。細節見 <a href="plan100.html">100 天</a>。</div></li>`;
  return real+(st.after?after:now);}

function draw(){who();const p=D.people[st.p];history.replaceState(null,'','#who='+p.key+(st.after?'&after=1':''));
  $('person').innerHTML=`<div class="sw" role="tablist"><button data-a="0" class="${st.after?'':'on'}">現在</button><button data-a="1" class="${st.after?'on':''}">照建議改之後</button></div>
    <div class="stage"><ol class="moments">${moments(p)}</ol><div class="map">${map(p)}</div></div>
    <div class="more">看細節：<a href="flow.html#route=${encodeURIComponent(p.route)}&t=${p.hours[0]}:00">② ${esc(p.route)}這條車怎麼跑</a><a href="network.html#mode=plan">① 看提案地圖</a><a href="plan100.html">100 天建議</a></div>`;
  $('person').querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{st.after=b.dataset.a==='1';draw();});
  const g=D.people.find(x=>x.role==='gain'),y=D.people.find(x=>x.role==='pay');
  $('end').innerHTML=`<h2>同一個改法，兩個人的感受不一樣</h2><div class="two">
    <div><b>${esc(g.who)}・${esc(g.name)}</b>：${esc(g.route)}班次變多，平均等車 ${f1(g.wait.now)} → ${f1(g.wait.after)} 分 ${T('est','推估')}</div>
    <div><b>${esc(y.who)}・${esc(y.name)}</b>：時間差不多，但要多轉一次車 ${T('est','推估')}</div></div>
    <p class="note">所以建議先試辦、先去現場數人，再決定要不要全面改。市府調的是路線和班表；每分鐘的調度由業者負責。</p>`;}
draw();
</script>
